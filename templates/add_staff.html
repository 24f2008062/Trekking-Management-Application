{% extends 'base.html' %}

{% block title %}Add New Staff - Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3 mb-5">
    <div class="col-md-8 col-lg-6">
        <div class="mb-3">
            <a href="/admin-dashboard" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white border-bottom py-3">
                <h4 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-compass text-primary me-2"></i>Add New Staff
                </h4>
            </div>

            <div class="card-body p-4">
                <form action="/add-staff" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Shashwat Singh"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="e.g. shashwat_Singh" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="text" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <input type="text" class="form-control" id="address" name="address" required>
                    </div>


                    <div class="d-flex justify-content-end gap-2">
                        <a href="/admin-dashboard" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Save Staff
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
