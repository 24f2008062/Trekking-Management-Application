{% extends 'base.html' %}

{% block title %}Add Expedition // Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8 col-lg-7">

        <!-- Back Button -->
        <div class="mb-3">
            <a href="{{ url_for('admin_dashboard', tab='manage-treks') }}" class="btn bh-btn bh-btn-secondary">
                <i class="bi bi-arrow-left me-1"></i> RETURN TO CATALOG
            </a>
        </div>

        <!-- Add Trek Form Card -->
        <div class="card bh-card border-3 border-dark" style="box-shadow: 6px 6px 0px #121212;">
            <div class="bh-card-header bh-header-black">
                <span class="fw-bold">02A // NEW EXPEDITION PROVISIONING</span>
                <span class="font-mono small">ADMIN</span>
            </div>

            <div class="card-body p-4 p-md-5">
                <h3 class="fw-bold mb-1">PROVISION NEW EXPEDITION</h3>
                <p class="font-mono text-muted small mb-4">REGISTER ROUTE PARAMETERS, CAPACITY, AND GUIDE LEAD</p>

                <form action="/add-trek" method="POST">

                    <!-- Trek Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label bh-label">■ EXPEDITION / TRAIL TITLE</label>
                        <input type="text" class="form-control bh-form-control font-mono" id="name" name="name" 
                            placeholder="e.g. Kedarkantha Winter Summit" required autofocus>
                    </div>

                    <!-- Location -->
                    <div class="mb-3">
                        <label for="location" class="form-label bh-label">■ GEOGRAPHIC REGION</label>
                        <input type="text" class="form-control bh-form-control font-mono" id="location" name="location"
                            placeholder="e.g. Garhwal Himalayas, Uttarakhand">
                    </div>

                    <!-- Difficulty & Duration -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="difficulty" class="form-label bh-label">■ TERRAIN DIFFICULTY</label>
                            <select class="form-select bh-form-control font-mono" id="difficulty" name="difficulty" required>
                                <option value="" selected disabled>SELECT RATING</option>
                                <option value="Easy">EASY // BEGINNER</option>
                                <option value="Moderate">MODERATE // INTERMEDIATE</option>
                                <option value="Hard">HARD // ADVANCED ALPINE</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="duration" class="form-label bh-label">■ EXPEDITION DURATION</label>
                            <input type="text" class="form-control bh-form-control font-mono" id="duration" name="duration"
                                placeholder="e.g. 5 Days / 4 Nights" required>
                        </div>
                    </div>

                    <!-- Available Slots & Status -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="available_slots" class="form-label bh-label">■ TOTAL CAPACITY SLOTS</label>
                            <input type="number" class="form-control bh-form-control font-mono" id="available_slots" name="available_slots" min="1"
                                placeholder="20" value="20" required>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label bh-label">■ INITIAL STATUS</label>
                            <select class="form-select bh-form-control font-mono" id="status" name="status" required>
                                <option value="Open" selected>OPEN // ACCEPTING RESERVATIONS</option>
                                <option value="Closed">CLOSED // RESTRICTED</option>
                            </select>
                        </div>
                    </div>

                    <!-- Assign Staff -->
                    <div class="mb-4">
                        <label for="assigned_staff_id" class="form-label bh-label">■ DESIGNATED ALPINE LEAD GUIDE</label>
                        <select name="assigned_staff_id" id="assigned_staff_id" class="form-select bh-form-control font-mono">
                            <option value="">-- UNASSIGNED (ALLOCATE LATER) --</option>
                            {% for s in staff %}
                            <option value="{{ s.id }}">{{ s.name }} (GUIDE #{{ s.id }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Action Buttons -->
                    <div class="border-top border-2 border-dark pt-4 mt-4 d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('admin_dashboard', tab='manage-treks') }}" class="btn bh-btn bh-btn-secondary">
                            ABORT
                        </a>
                        <button type="submit" class="btn bh-btn bh-btn-primary py-2 px-4">
                            <i class="bi bi-plus-square me-1"></i> COMMIT TO CATALOG
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
