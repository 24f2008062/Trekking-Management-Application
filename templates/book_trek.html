{% extends 'base.html' %}

{% block title %}Book Trek{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8 col-lg-6">

        <!-- Back Button -->
        <div class="mb-3">
            <a href="{{ url_for('trekker_dashboard', tab='book-treks') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Treks
            </a>
        </div>

        <!-- Book Trek Card -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white border-bottom py-3">
                <h4 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-ticket-perforated text-primary me-2"></i>Book Trek
                </h4>
                <small class="text-muted">Confirm your details to book this trek.</small>
            </div>

            <div class="card-body p-4">
                <form action="{{ url_for('book_trek', trek_id=trek.id) }}" method="POST">

                    <!-- Trek Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Trek Name</label>
                        <input type="text" class="form-control bg-light"
                            value="{{ trek.name if trek else 'Trek Booking' }}" readonly>
                    </div>

                    <!-- Trekker Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control bg-light" id="name" name="name"
                            value="{{ current_user.name if current_user else '' }}" readonly>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control bg-light" id="email" name="email"
                            value="{{ current_user.email if current_user else '' }}" readonly>
                    </div>

                    <!-- Number of Slots -->
                    <div class="mb-3">
                        <label for="slots" class="form-label fw-semibold">Number of Trekkers</label>
                        <input type="number" class="form-control bg-light" id="slots" name="slots" min="1" value="1"
                            readonly>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('trekker_dashboard', tab='book-treks') }}"
                            class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Confirm Booking
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
