{% extends 'base.html' %}

{% block content %}

<h2>Register</h2>
<hr>

{% if error %}
<div class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    {{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}

<form action="/register" method="post">

    <div class="mb-3">
        <label for="nameinput" class="form-label">Name</label>
        <input type="text" class="form-control" id="nameinput" name="name" placeholder="Enter your name" required>
    </div>

    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username"
            required>
    </div>

    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email"
            required>
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>

    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="password" required>
    </div>

    <div class="mb-3">
        <label for="role" class="form-label">Register As</label>
        <select class="form-select" id="role" name="role" required>
            <option value="trekker" selected>Trekker</option>
            <option value="staff">Trek Staff</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary d-block mx-auto mt-3">Register</button>
</form>
{% endblock %}
