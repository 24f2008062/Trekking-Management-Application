{% extends 'base.html' %}

{% block content %}

    <h2>Staff Profile Details</h2>
    <p class="text-muted">Please provide your phone number and address to complete staff registration.</p>
    <hr>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <form action="/complete-staff-profile/{{ user_id }}" method="post">

        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" 
                   placeholder="10-digit phone number" 
                   pattern="[0-9]{10}" 
                   maxlength="10" 
                   title="Phone number must not be more than 10 digits" 
                   required>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" placeholder="Enter your address" required>
        </div>

        <button type="submit" class="btn btn-primary d-block mx-auto mt-3">Complete Registration</button>
    </form>
{% endblock %}
