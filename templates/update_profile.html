{% extends 'base.html' %}

{% block title %}Update Profile - Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3 mb-5">
    <div class="col-md-8 col-lg-6">

        <!-- Back Button -->
        <div class="mb-3">
            <a href="{{ url_for('staff_dashboard', tab='profile') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Profile
            </a>
        </div>

        <!-- Update Profile Card -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white border-bottom py-3">
                <h4 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-person-gear text-primary me-2"></i>Update Profile
                </h4>
                <small class="text-muted">Modify your personal contact details below.</small>
            </div>

            <div class="card-body p-4">
                <form action="/update-profile" method="POST">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                            value="{{ current_user.name }}" required>
                    </div>

                    <!-- Username (Read-only) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted">Username</label>
                        <input type="text" class="form-control bg-light" value="{{ current_user.username }}" readonly disabled>
                    </div>

                    <!-- Email (Read-only) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly disabled>
                    </div>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                            placeholder="e.g. 9876543210"
                            value="{{ current_user.profile.phone if current_user.profile and current_user.profile.phone else '' }}">
                    </div>

                    <!-- Address -->
                    <div class="mb-4">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3"
                            placeholder="Enter your full address">{{ current_user.profile.Address if current_user.profile and current_user.profile.Address else '' }}</textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('staff_dashboard', tab='profile') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Save Profile
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
