{% extends 'base.html' %}

{% block title %}Update Guide Profile // Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8 col-lg-6">

        <!-- Back Button -->
        <div class="mb-3">
            <a href="{{ url_for('staff_dashboard', tab='profile') }}" class="btn bh-btn bh-btn-secondary">
                <i class="bi bi-arrow-left me-1"></i> BACK TO PROFILE
            </a>
        </div>

        <!-- Update Profile Card -->
        <div class="card bh-card border-3 border-dark" style="box-shadow: 6px 6px 0px #121212;">
            <div class="bh-card-header bh-header-yellow">
                <span class="text-dark fw-bold">02D // GUIDE DOSSIER UPDATE</span>
                <span class="font-mono small text-dark">STAFF RECORD</span>
            </div>

            <div class="card-body p-4 p-md-5">
                <h3 class="fw-bold mb-1">UPDATE GUIDE PROFILE</h3>
                <p class="font-mono text-muted small mb-4">MAINTAIN OPERATIONAL CONTACT CHANNELS</p>

                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center justify-content-between mb-4 border border-dark rounded-0" role="alert">
                    <div>
                        <i class="bi bi-exclamation-octagon-fill me-2"></i>
                        <span class="small fw-bold font-mono">{{ error }}</span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form action="/update-profile" method="POST">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label bh-label">■ LEGAL FULL NAME</label>
                        <input type="text" class="form-control bh-form-control font-mono" id="name" name="name"
                            value="{{ current_user.name }}" required>
                    </div>

                    <!-- Username (Read-only) -->
                    <div class="mb-3">
                        <label class="form-label bh-label text-muted">■ USERNAME (READ-ONLY)</label>
                        <input type="text" class="form-control bh-form-control font-mono bg-light text-muted" value="{{ current_user.username }}" readonly disabled>
                    </div>

                    <!-- Email (Read-only) -->
                    <div class="mb-3">
                        <label class="form-label bh-label text-muted">■ SYSTEM EMAIL (READ-ONLY)</label>
                        <input type="email" class="form-control bh-form-control font-mono bg-light text-muted" value="{{ current_user.email }}" readonly disabled>
                    </div>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phone" class="form-label bh-label">■ EMERGENCY PHONE (10 DIGITS)</label>
                        <input type="tel" class="form-control bh-form-control font-mono" id="phone" name="phone"
                            placeholder="e.g. 9876543210"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            title="Phone number must not be more than 10 digits"
                            value="{{ current_user.profile.phone if current_user.profile and current_user.profile.phone else '' }}">
                    </div>

                    <!-- Address -->
                    <div class="mb-4">
                        <label for="address" class="form-label bh-label">■ BASECAMP RESIDENCE</label>
                        <textarea class="form-control bh-form-control font-mono" id="address" name="address" rows="3"
                            placeholder="Enter physical basecamp address">{{ current_user.profile.Address if current_user.profile and current_user.profile.Address else '' }}</textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="border-top border-2 border-dark pt-4 mt-4 d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('staff_dashboard', tab='profile') }}" class="btn bh-btn bh-btn-secondary">
                            ABORT
                        </a>
                        <button type="submit" class="btn bh-btn bh-btn-primary py-2 px-4">
                            <i class="bi bi-check2-circle me-1"></i> COMMIT PROFILE
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
